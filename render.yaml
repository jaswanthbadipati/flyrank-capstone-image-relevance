services:
  - type: web
    name: flyrank-image-matching-engine
    runtime: python
    buildCommand: pip install -r requirements.txt && python scripts/seed_corpus.py
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: AI_PROVIDER
        value: offline
